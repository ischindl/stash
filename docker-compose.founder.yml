# Founder-stack pin: the one tracked file that names the commit our own stack runs.
#
# Self-hosters never use this file. It is the fourth `-f` overlay, after
# docker-compose.prod.yml, docker-compose.local.yml and docker-compose.dogfood.yml,
# and it retags every lane to a locally built image whose tag carries the commit it was
# built from. It carries one other thing, declared here rather than in the published
# files because it is a fact about THIS box and nobody else's: the curator catch-up
# cadence on the celery lanes. A self-hoster must not inherit a 96-pass chain, and the
# alternative -- the value in an untracked env file on this host -- is the knowledge
# loss this file's header exists to prevent. Before this file existed that knowledge
# lived in untracked root files in one checkout, so no other worktree could see what
# the founder stack was running and no test could read it.
#
# BOTH TAGS BELOW MUST NAME THE SAME COMMIT. A pair that names two commits is how a
# frontend-only deploy once shipped a Test button calling a route the running backend
# did not have: the founder clicked it and it 404'd. The guard is
# backend/tests/test_founder_deploy_pin.py, which derives the lane set from
# docker-compose.prod.yml and compares the two hexes, so adding a queue without
# pinning it here, or moving one lane alone, fails the suite.
#
# The images are built from a tree detached at that exact commit by the runbook in
# docs/trunk-publish-and-deploy.md, which also owns the proof-before-cutover recipe,
# the `up -d --no-deps` command with its `-p stash` project name and full `-f` list,
# and the rollback truth. Nothing is built here: no build section, no registry, no
# interpolation and no default, because a defaulted tag lets a lane boot an image
# nobody chose.
#
# BASE_IMAGE still has to be exported when running compose with this file even though
# nothing builds: docker-compose.dogfood.yml declares it as a required interpolation
# with no default, and compose resolves it for every command, `config` and `up`
# included. Set it to the same commit's pi overlay, e.g.
#   BASE_IMAGE=stash-backend:main-d66b943d-pi docker compose -p stash ... config --quiet
#
# PINNED 2026-11-21 UTC to `d66b943d`, trunk's tip, built from a tree detached at exactly
# it by the runbook. Both hexes name that one commit. It carries the previous pin's scoped-lane
# throughput work (STAS-490) and the OTHER half of the same wall (STAS-491): a personal-lane
# run used to be handed its entire unread delta and one wall, spent the wall reading, raised
# the ceiling and committed nothing, while its own wiki writer had already edited pages from
# that partial read - so the wiki drifted and the watermark never moved, on every founder
# lane, since 2026-09-01. A personal pass now reads the part its wall pays for once the wiki
# writer is paid first, and commits through the exact instant that part ends at.
#
# Proof, on a copy of the founder's own database and never on the founder's database: the
# dump (`pg_dump -Fc`, 4 797 889 649 bytes) restored into a pgvector container this deploy
# owned (`-j 4`, rc 0, 144 tables, `0275`), then booted with the candidate, which ran
# `Running upgrade 0275 -> 0276`, answered `/health` 200, served `x-stash-cli-latest: 0.1.491`,
# and left the copy at `0276`. No new revision was expected or seen: this card adds none.
#
# The measurement the card is made of was then read on THAT copy, on the founder's own
# `Wiki curator - Fusion - saneca` lane (wall 570s, watermark 2026-09-01 08:29:33), by
# calling the three functions a real run calls: the unpriced feed handed to a run today is
# 500 events / 192,574 characters with more behind it, and the same call given the priced
# window is 3 events / 12 characters ending at 08:29:33.740. The old commit of that same
# call recorded 09:29:43.841 - one hour and the whole unread rest of an hour AHEAD of what
# the model was shown. That gap, an hour of characters claimed and never read, every night,
# is the bug. The new one records 08:29:33.740: the last event shown is the last event kept.
# The dump, the restored copy, the proof redis and the candidate container sit outside this
# repo under /data2/ceo-deploy-d66b943d, with the probe that printed those numbers.
#
# Post-cutover readings taken at the pin are carried by the commit that wrote these two hexes,
# `cadaa0f69` - `refs/heads/deploy/main` itself was moved by a message-carrying `update-ref`,
# which leaves a reflog row and no commit body. The readings that measure the claim are
# `docker inspect` on the five started containers, `X-Stash-Cli-Latest`, and `/login`.
#
# A pin is a claim about the stack: `docker inspect` on the five started containers,
# `X-Stash-Cli-Latest` and `/login` are the readings that measure it, and the rehearsal,
# the value census, the rollback dump and the rollback truth are recorded in
# docs/trunk-publish-and-deploy.md beside the claim.

services:
  backend:
    image: stash-backend:main-d66b943d-pi

  worker:
    image: stash-backend:main-d66b943d-pi
    # Curator catch-up passes one lane may chain per day, at STAS-490's measured rate:
    # 96 chained passes of a 570 s wall is about a 63% duty cycle of this box's own
    # inference, competing with the operator's chat turns. The code default is 8, and
    # `docker-compose.prod.yml` never declares it, so the number is this stack's alone.
    environment:
      CURATOR_CATCHUP_PASSES: "96"

  heavy-worker:
    image: stash-backend:main-d66b943d-pi
    # The same cadence the worker chain runs under; the beat and the lanes that execute
    # the chain must read one number, not two.
    environment:
      CURATOR_CATCHUP_PASSES: "96"

  sync-worker:
    image: stash-backend:main-d66b943d-pi

  beat:
    image: stash-backend:main-d66b943d-pi
    environment:
      CURATOR_CATCHUP_PASSES: "96"

  frontend:
    image: stash-frontend:main-d66b943d
